<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản Lý Khách Hàng | ShopAdmin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="container">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <header>
      <button class="menu-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Tìm tên hoặc email..." />
      </div>
      <a href="create.html" class="btn btn-add"><i class="fas fa-user-plus"></i> Thêm khách hàng</a>
    </header>

    <section class="stats">
      <div class="card">
        <h3>Tổng khách hàng</h3>
        <p id="statTotalCustomers">--</p>
      </div>
      <div class="card">
        <h3>Hạng Vàng</h3>
        <p id="statGold">--</p>
      </div>
      <div class="card">
        <h3>Hạng Bạc</h3>
        <p id="statSilver">--</p>
      </div>
    </section>

    <section class="table-container">
      <div class="table-header">
        <h3>Danh sách khách hàng</h3>
      </div>
      <table>
        <thead>
        <tr>
          <th>Khách hàng</th>
          <th>Liên hệ</th>
          <th>Hạng</th>
          <th>Tổng chi tiêu</th>
          <th>Thao tác</th>
        </tr>
        </thead>
        <tbody id="customerTableBody">
        <tr><td colspan="5" class="loading-state">Đang tải dữ liệu...</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</div>

<!-- Modal xác nhận xóa -->
<div id="deleteModal" class="modal">
  <div class="modal-content">
    <h3>Xác nhận xóa</h3>
    <p id="deleteModalText">Bạn có chắc chắn muốn xóa khách hàng này không?</p>
    <div class="modal-buttons">
      <button class="btn btn-cancel" id="deleteCancelBtn">Cancel</button>
      <button class="btn" style="background:#e74c3c; color:white;" id="deleteConfirmBtn">OK</button>
    </div>
  </div>
</div>

<script src="../auth.js"></script>
<script src="../api.js"></script>
<script src="../sidebar.js"></script>
<script src="customers.js"></script>
</body>
</html>
