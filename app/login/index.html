<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập | ShopAdmin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="login.css" />
</head>
<body>

<div class="login-page">
    <div class="login-box">
        <h1><i class="fas fa-store"></i> ShopAdmin</h1>
        <p class="subtitle">Đăng nhập để quản lý cửa hàng</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Nhập email" required autocomplete="username" />
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required autocomplete="current-password" />
            </div>
            <p class="form-error" id="loginError"></p>
            <button type="submit" class="btn-login" id="loginSubmitBtn">Đăng nhập</button>
        </form>
    </div>
</div>

<script src="../auth.js"></script>
<script src="../api.js"></script>
<script src="login.js"></script>
</body>
</html>
