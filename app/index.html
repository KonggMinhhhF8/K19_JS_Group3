<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tổng quan | ShopAdmin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="container">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <header>
      <button class="menu-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
      <h2 style="margin:0;">Tổng quan</h2>
      <div class="user"><strong>Admin</strong> <i class="fas fa-user-circle"></i></div>
    </header>

    <section class="stats">
      <div class="card"><h3>Tổng sản phẩm</h3><p id="statProducts">--</p></div>
      <div class="card"><h3>Tổng khách hàng</h3><p id="statCustomers">--</p></div>
      <div class="card"><h3>Tổng đơn hàng</h3><p id="statOrders">--</p></div>
      <div class="card"><h3>Doanh thu (đơn hoàn thành)</h3><p id="statRevenue">--</p></div>
    </section>

    <section class="table-section">
      <div class="table-title">
        <h3>Đơn hàng gần đây</h3>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
          <tr>
            <th>Mã đơn</th>
            <th>Khách hàng</th>
            <th>Trạng thái</th>
            <th>Tổng tiền</th>
          </tr>
          </thead>
          <tbody id="recentOrdersBody">
          <tr><td colspan="4" class="loading-state">Đang tải dữ liệu...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="auth.js"></script>
<script src="api.js"></script>
<script src="sidebar.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
