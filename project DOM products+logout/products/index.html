<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Quản Lý Sản Phẩm | ShopAdmin</title>

        <link rel="stylesheet" href="../style.css" />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        />
    </head>

    <body>
        <div class="container">
            <aside class="sidebar">
                <h2>ShopAdmin</h2>

                <ul>
                    <li>
                        <i class="fas fa-home"></i>
                        Tổng quan
                    </li>

                    <li class="active">
                        <i class="fas fa-box"></i>
                        Sản phẩm
                    </li>

                    <li>
                        <i class="fas fa-shopping-cart"></i>
                        Đơn hàng
                    </li>

                    <li>
                        <i class="fas fa-users"></i>
                        Khách hàng
                    </li>

                    <li>
                        <i class="fas fa-chart-line"></i>
                        Báo cáo
                    </li>

                    <li id="logout">
                        <i class="fas fa-sign-out-alt"></i>
                        Đăng xuất
                    </li>
                </ul>
            </aside>

            <main class="main-content">
                <header>
                    <div class="search-bar">
                        <input
                            id="searchInput"
                            type="text"
                            placeholder="Tìm tên sản phẩm, mã SKU..."
                        />
                    </div>

                    <div class="user-actions">
                        <button
                            class="btn-add"
                            onclick="window.location.href='create.html'"
                        >
                            <i class="fas fa-plus"></i>

                            Thêm sản phẩm
                        </button>
                    </div>
                </header>

                <section class="stats">
                    <div class="card">
                        <h3>Tổng sản phẩm</h3>

                        <p id="totalProduct">0</p>
                    </div>

                    <div class="card">
                        <h3>Sắp hết hàng</h3>

                        <p id="lowStock" style="color: #e74c3c">0</p>
                    </div>

                    <div class="card">
                        <h3>Danh mục</h3>

                        <p id="totalCategory">0</p>
                    </div>
                </section>

                <section class="table-container">
                    <div class="table-header">
                        <h3>Danh sách sản phẩm</h3>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Hình</th>

                                <th>Thông tin sản phẩm</th>

                                <th>Danh mục</th>

                                <th>Giá bán</th>

                                <th>Tồn kho</th>

                                <th>Thao tác</th>
                            </tr>
                        </thead>

                        <tbody id="productTableBody"></tbody>
                    </table>
                </section>
            </main>
        </div>

        <script src="../product.js/auth.js"></script>

        <script src="../product.js/product.js"></script>
    </body>
</html>
